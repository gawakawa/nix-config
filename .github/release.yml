changelog:
  exclude:
    labels:
      - dependencies
    authors:
      - renovate[bot]
  categories:
    - title: "✨ Features"
      labels:
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - bug
    - title: "📝 Documentation"
      labels:
        - documentation
    - title: "🔄 Other Changes"
      labels:
        - "*"
