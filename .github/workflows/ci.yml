name: "CI"

on:
  pull_request:

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nix-config: ${{ steps.filter.outputs.nix-config }}
      nvim: ${{ steps.filter.outputs.nvim }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            nix-config:
              - '**'
              - '!nvim/**'
            nvim:
              - 'nvim/**'

  build-nix-config:
    needs: detect-changes
    if: needs.detect-changes.outputs.nix-config == 'true'
    strategy:
      matrix:
        include:
          - platform: nixos
            runs-on: ubuntu-latest
            build-target: nixosConfigurations.nixos.config.system.build.toplevel
          - platform: darwin
            runs-on: macos-latest
            build-target: darwinConfigurations.mac.system
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: gawakawa
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Flake check
        run: nix flake check --accept-flake-config

      - name: Build ${{ matrix.platform }} configuration
        run: nix build .#${{ matrix.build-target }} --accept-flake-config --show-trace

  build-nvim:
    needs: detect-changes
    if: needs.detect-changes.outputs.nvim == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: gawakawa
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Flake check
        run: nix flake check ./nvim --accept-flake-config

      - name: Build Neovim package
        run: nix build ./nvim

  ci-success:
    needs: [detect-changes, build-nix-config, build-nvim]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify build-nix-config
        if: needs.detect-changes.outputs.nix-config == 'true'
        run: test "${{ needs.build-nix-config.result }}" == "success"

      - name: Verify build-nvim
        if: needs.detect-changes.outputs.nvim == 'true'
        run: test "${{ needs.build-nvim.result }}" == "success"
